version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-bloomcare
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2003"
      POSTGRES_DB: bloomcare
    ports:
      - "55432:5432"
    volumes:
      - D:\bloomcare\db-data:/var/lib/postgresql/data
