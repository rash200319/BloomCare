services:
  db:
    image: postgres:15
    container_name: bloomcare_postgres
    restart: always
    environment:
      POSTGRES_USER: bloomcare_user
      POSTGRES_PASSWORD: bloomcare_pass
      POSTGRES_DB: bloomcare_db
    ports:
      # Override with e.g. `POSTGRES_HOST_PORT=5433 docker compose up -d` if
      # another PostgreSQL instance already owns 5432 on the host.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
