version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloomcare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # This hostname "db" matches the database service name below
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2003
      - POSTGRES_DB=bloomcare
      - POSTGRES_PORT=5432
      # Authentication and Configuration
      - SECRET_KEY=bloomcare-docker-secret-key-change-in-production-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      # AI Model Configuration
      - BLOOMCARE_MOCK_LLM=true
      - DEBUG=true
    volumes:
      # Mount the models directory from the parent directory
      - ../models:/models
      # Mount app code for dev hot-reloading (optional)
      #- ./app:/app/app
      #- ./alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bloomcare_network

  db:
    image: postgres:15-alpine
    container_name: bloomcare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2003
      POSTGRES_DB: bloomcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bloomcare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bloomcare_network

volumes:
  postgres_data:
    name: bloomcare_pg_data

networks:
  bloomcare_network:
    name: bloomcare_default_network
